# debug.cfg -- OpenOCD configuration for debugging the ESP32-S31 over its
# built-in USB-Serial/JTAG (/dev/cu.usbmodem*).  Used by CLion's "S31 Debug"
# Embedded GDB Server configuration, and works the same from the command line:
#
#   scripts/clion/openocd -f debug.cfg
#   scripts/clion/gdb -ex 'target extended-remote localhost:3333' build/ESP32-S31-Template.elf
#
# Stop OpenOCD before flashing -- esptool needs the same USB device.

# FreeRTOS thread awareness is left ON (Espressif's default): CLion then shows
# one thread per FreeRTOS task.  If CLion ever misses a breakpoint stop (the
# session looks "running" while the core is actually halted, and idea.log has
# "Cannot retrieve info for thread N"), uncomment this line:
# set ESP_RTOS none

source [find board/esp32s31-builtin.cfg]

# Turn every GDB breakpoint into a hardware one.  CLion's line breakpoints are
# software breakpoints, and the second-stage bootloader reloads IRAM from flash
# on every reset -- after the debugger wrote the breakpoint -- so a software
# breakpoint in IRAM_ATTR code is silently erased while GDB still shows it
# armed.  Cost: the hardware trigger budget, so keep few breakpoints enabled.
gdb breakpoint_override hard

# An IDE Stop halts the core before GDB detaches, which otherwise leaves the
# board frozen after every debug session.  Resume it on detach instead.
$_TARGETNAME_0 configure -event gdb-detach {
	if { [$_TARGETNAME_0 curstate] eq "halted" } { resume }
}
